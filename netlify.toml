# Vista previa de la version en React (rama mejoras). GitHub Pages solo
# publica main; esto deja ver react/ en internet mientras dura la migracion.
# Netlify clona el repo entero, asi que el alias @raiz de vite.config.js
# encuentra data/productos.json y assets/ en la raiz.
[build]
  base = "react"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.15.0"
