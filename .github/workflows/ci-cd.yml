name: Validar y publicar sitio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Validar archivos y referencias
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s mascota.png
          grep -q 'mascota.png' index.html
          # El catalogo crece y encoge: un numero exacto obliga a acordarse de
          # tocar el CI cada vez que entra un producto, y cuando no te acuerdas
          # el sitio deja de publicarse sin que nadie lo note. Se comprueba que
          # el archivo no venga truncado y que a cada categoria se pueda llegar,
          # que es lo que de verdad puede romperse.
          test "$(grep -o '<article class="product-card"' index.html | wc -l)" -ge 8
          # La unica puerta al catalogo es el menu Tienda: si una categoria no
          # esta ahi, sus productos quedan inalcanzables, y al reves, una entrada
          # del menu sin productos detras lleva a una vista vacia.
          categorias=$(grep -o 'data-category="[^"]*"' index.html | sed 's/.*="//;s/"$//' | sort -u)
          entradas=$(grep -o 'data-filtro="[^"]*"' index.html | sed 's/.*="//;s/"$//' | sort -u)
          for c in $categorias; do
            if ! echo "$entradas" | grep -qx "$c"; then
              echo "La categoria '$c' no se puede abrir desde el menu Tienda."
              exit 1
            fi
          done
          # "Todo el catalogo" y "todos" no son categorias: son la puerta a
          # todas a la vez, y el script las trata aparte. Exigirles productos
          # propios tumbaba el despliegue por algo que esta bien.
          for e in $entradas; do
            case "$e" in catalogo|todos) continue ;; esac
            if ! echo "$categorias" | grep -qx "$e"; then
              echo "La entrada '$e' del menu Tienda no tiene ningun producto detras."
              exit 1
            fi
          done
          if grep -Eiq 'cocktail|coctel|cóctel|cafeter[ií]a|caf[eé]' index.html styles.css; then
            echo 'Se encontro una referencia no permitida a cafeteria, cafe o cocteles.'
            exit 1
          fi
          git diff --check

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4