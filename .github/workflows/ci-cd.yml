name: Validar y publicar sitio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Validar archivos y referencias
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s mascota.png
          grep -q 'mascota.png' index.html
          test "$(grep -o '<article class="product-card"' index.html | wc -l)" -eq 9
          test "$(grep -o 'id="filter-' index.html | wc -l)" -eq 5
          if grep -Eiq 'cocktail|coctel|cóctel|cafeter[ií]a|caf[eé]' index.html styles.css; then
            echo 'Se encontro una referencia no permitida a cafeteria, cafe o cocteles.'
            exit 1
          fi
          git diff --check

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4