name: Validar y publicar sitio

on:
  # Se valida en cualquier rama (tambien en mejoras); publicar, solo desde main.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7.0.1

      # npm ci instala lo que dice package-lock.json, ni una version mas, y
      # falla si no cuadra con package.json.
      - name: Preparar Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar
        shell: bash
        run: npm ci

      # Un aviso del build (un import que no se resuelve, un trozo demasiado
      # grande) no para a Vite, pero casi siempre es algo roto: aqui si para.
      # El runner distingue mayusculas, asi que un import con otra mayuscula
      # (que en Windows funciona) rompe aqui y no en lo publicado.
      # ci-local.sh corre este paso tal cual.
      - name: Construir
        shell: bash
        run: |
          set -euo pipefail
          salida=$(mktemp)
          npm run build 2>&1 | tee "$salida"
          if grep -Eiq '\(!\)|warn' "$salida"; then
            echo 'El build dio avisos (arriba): hay que dejarlo sin ninguno.'
            exit 1
          fi
          test -s dist/index.html

      # El catalogo va dentro del build, y si un producto viene mal la portada
      # lo dice en vez de pintar la vitrina: el build sale bien igual. Aqui se
      # revisa con las mismas reglas que usa el sitio
      # (src/servicios/reglasCatalogo.js, sin nada de Vite, para que node las
      # cargue) y no con una copia de ellas. ci-local.sh corre este paso tal cual.
      - name: Validar catalogo, fotos y textos
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/css/styles.css
          test -s assets/img/mascota.png
          test -s data/productos.json

          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            const { revisar } = await import("./src/servicios/reglasCatalogo.js");
            const { CATEGORIAS } = await import("./src/catalogo/categorias.js");
            const datos = JSON.parse(readFileSync("data/productos.json", "utf8"));
            const productos = datos.productos;
            if (!Array.isArray(productos) || !productos.length) {
              throw new Error("data/productos.json no trae ningun producto");
            }
            productos.forEach(revisar);
            // El catalogo crece y encoge: un numero exacto obliga a acordarse de
            // tocar el CI cada vez que entra un producto. Se comprueba que el
            // archivo no venga truncado, que es lo que de verdad puede romperse.
            if (productos.length < 8) {
              throw new Error(`solo hay ${productos.length} productos: el archivo parece truncado`);
            }
            // La unica puerta a cada categoria es el menu Tienda, que pinta
            // MenuTienda.jsx con CATEGORIAS (src/catalogo/categorias.js): si
            // una categoria no esta ahi, sus productos quedan inalcanzables, y
            // al reves, una entrada del menu sin productos detras lleva a una
            // vista vacia.
            const entradas = new Set(CATEGORIAS.map((c) => c.id));
            const categorias = new Set(productos.map((p) => p.categoria));
            for (const c of categorias) {
              if (!entradas.has(c)) throw new Error(`la categoria "${c}" no se puede abrir desde el menu Tienda`);
            }
            for (const e of entradas) {
              if (!categorias.has(e)) throw new Error(`la entrada "${e}" del menu Tienda no tiene ningun producto detras`);
            }
            // Cada foto en sus dos anchos. El sitio tambien lo mira al leer el
            // catalogo, pero solo en el navegador: aqui se dice cual falta.
            const ANCHOS = [420, 840];
            for (const p of productos) {
              for (const w of ANCHOS) {
                const ruta = `${p.foto}-${w}.jpg`;
                if (!existsSync(ruta)) throw new Error(`falta ${ruta}, la foto de "${p.nombre}"`);
              }
            }
            // La portada (900 y 1600, en index.html y styles.css) y la que se
            // ve al compartir el enlace (1200, que vite.config.js deja en
            // dist/assets/img/ con su nombre de siempre).
            for (const h of ["assets/img/hero-900.jpg", "assets/img/hero-1600.jpg", "assets/img/hero-1200.jpg", "dist/assets/img/hero-1200.jpg"]) {
              if (!existsSync(h)) throw new Error(`falta ${h}`);
            }
            console.log(`${productos.length} productos en ${categorias.size} categorias, todas alcanzables.`);
            console.log(`${productos.length * ANCHOS.length + 3} fotos en su sitio.`);
          '

          # Es una panaderia: tambien en comentarios y ejemplos.
          if grep -rEiq 'cocktail|coctel|cóctel|cafeter[ií]a|caf[eé]' index.html src assets/css data/productos.json; then
            grep -rEin 'cocktail|coctel|cóctel|cafeter[ií]a|caf[eé]' index.html src assets/css data/productos.json
            echo 'Se encontro una referencia no permitida a cafeteria, cafe o cocteles.'
            exit 1
          fi
          git diff --check

      # La prueba de humo (pruebas/casos/humo.mjs) en el Chrome que ya trae el
      # runner: arranca, agrega a la canasta y crea una cuenta. Las largas se
      # corren en local con npm run probar. playwright-core va a una carpeta
      # temporal, fuera del repo y de package.json.
      - name: Prueba de humo en Chrome
        shell: bash
        env:
          NAVEGADOR: chrome
          PANADERIA_HERRAMIENTAS: ${{ runner.temp }}/panaderia-herramientas
        timeout-minutes: 5
        run: npm run probar -- humo

  # Se publica dist/, lo que arma Vite, y no la raiz: ni src/ ni node_modules
  # llegan a Pages.
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7.0.1

      - name: Preparar Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Construir
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
