  <!-- Sin JavaScript no hay tienda: React pinta toda la pagina. Lo que se ve
       entonces va aqui, con su hoja dentro del noscript, para que no pese a
       quien si lo tiene. Mismos colores y letras que el sitio (styles.css no
       ha llegado aun a esta altura, ni hace falta). -->
  <noscript>
    <style>
      .sin-js { box-sizing: border-box; min-height: 100vh; margin: 0; padding: 3rem 1.25rem; background: #f7f1e7; color: #3a2822; font: 1rem/1.55 Arial, sans-serif; }
      .sin-js-hoja { max-width: 34rem; margin: 0 auto; padding: 2rem 1.6rem; background: #fffdf8; border-top: 6px solid #d79b4a; border-radius: 18px; box-shadow: 0 10px 30px rgba(58, 40, 34, .12); }
      .sin-js-marca { margin: 0; color: #7a4030; font: 700 .8rem/1.3 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
      .sin-js h1 { margin: .35rem 0 1rem; font: 500 2rem/1.15 Georgia, serif; }
      .sin-js-aviso { margin: 0 0 1.5rem; padding: .8rem 1rem; background: rgba(215, 155, 74, .16); border-left: 4px solid #d79b4a; border-radius: 0 10px 10px 0; font-weight: 700; }
      .sin-js h2 { margin: 1.2rem 0 .3rem; color: #5e514a; font: 700 .8rem/1.3 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
      .sin-js address, .sin-js p { margin: 0; font-style: normal; }
      .sin-js dl { display: grid; grid-template-columns: auto 1fr; gap: .2rem 1rem; margin: 0; }
      .sin-js dt { font-weight: 700; }
      .sin-js dd { margin: 0; font-variant-numeric: tabular-nums; }
      .sin-js .sin-js-nota { margin-top: .6rem; color: #5e514a; font-size: .9rem; }
    </style>
  </noscript>
</head>
<body>
  <noscript>
    <main class="sin-js">
      <div class="sin-js-hoja">
        <p class="sin-js-marca">Panadería &amp; Pastelería</p>
        <h1>El Tradicional</h1>
        <p class="sin-js-aviso">Para comprar en El Tradicional necesitas activar JavaScript en tu navegador.</p>
        <h2>Dónde estamos</h2>
        <address>Esquina de Eloy Alfaro y Gabriel Espinosa, Tena</address>
        <h2>Horario</h2>
        <dl>
          <dt>Lunes a viernes</dt><dd>08:00 a 20:00</dd>
          <dt>Sábado y domingo</dt><dd>09:00 a 21:00</dd>
        </dl>
        <p class="sin-js-nota">En feriados nacionales cerramos.</p>
      </div>
    </main>
  </noscript>
  <div id="raiz"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
